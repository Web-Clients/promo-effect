name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # ─── Run tests first ────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: npm run test:coverage

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend

  # ─── Build frontend ─────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ─── Deploy to staging (auto on push to main) ───────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to staging
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.STAGING_SERVER_IP }} \
            "cd /opt/promo-effect && \
             git pull origin main && \
             npm ci --legacy-peer-deps && \
             npm run build && \
             cd backend && npm ci && npm run build && \
             npx prisma generate && \
             sudo systemctl restart promo-effect-backend && \
             sudo nginx -t && sudo systemctl reload nginx"

      - name: Health check — staging
        id: health_check
        run: |
          sleep 5
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.STAGING_URL }}/api/health" || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed: $HTTP_CODE"
            exit 1
          fi
          echo "Health check OK: $HTTP_CODE"

      - name: Rollback on failure
        if: failure() && steps.health_check.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.STAGING_SERVER_IP }} \
            "cd /opt/promo-effect && \
             git checkout HEAD~1 && \
             cd backend && npm run build && \
             sudo systemctl restart promo-effect-backend"
          echo "Rolled back to previous commit"

  # ─── Deploy to production (manual trigger only) ─────────────────────────────
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Backup database before deploy
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.PRODUCTION_SERVER_IP }} \
            "mkdir -p /opt/promo-effect/backups && \
             pg_dump -U promo_effect -Fc promo_effect \
               > /opt/promo-effect/backups/pre_deploy_$(date +%Y%m%d_%H%M%S).dump && \
             find /opt/promo-effect/backups -name 'pre_deploy_*.dump' -mtime +7 -delete"
          echo "Pre-deploy backup created"

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.PRODUCTION_SERVER_IP }} \
            "cd /opt/promo-effect && \
             git pull origin main && \
             npm ci --legacy-peer-deps && \
             npm run build && \
             cd backend && npm ci && npm run build && \
             npx prisma generate && \
             npx prisma migrate deploy && \
             sudo systemctl restart promo-effect-backend && \
             sudo nginx -t && sudo systemctl reload nginx"

      - name: Health check — production
        id: health_check_prod
        run: |
          sleep 5
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.PRODUCTION_URL }}/api/health" || echo "000")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Production health check FAILED: $HTTP_CODE"
            exit 1
          fi
          echo "Production health check OK: $HTTP_CODE"

      - name: Rollback production on failure
        if: failure() && steps.health_check_prod.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.PRODUCTION_SERVER_IP }} \
            "cd /opt/promo-effect && \
             git checkout HEAD~1 && \
             cd backend && npm run build && \
             npx prisma migrate deploy && \
             sudo systemctl restart promo-effect-backend"
          echo "PRODUCTION rolled back to previous commit"

      - name: Notify deploy success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ Promo-Effect PRODUCTION deployed successfully%0ACommit: ${{ github.sha }}%0ABy: ${{ github.actor }}" || true
